name: sahi ownership fetch

# Pulls the latest quarterly shareholding pattern (promoter / FII / DII / MF /
# public) for the two listed SAHIs (Star Health, Niva Bupa) via the muns chat
# agent and writes src/data/snapshots/ownership-snapshot.json. The Governance ›
# Ownership section renders straight from that snapshot.
#
# Secrets used:
#   MUNS_API_TOKEN  (required) bearer token for the chat agent.

on:
  schedule:
    # Full-auto (Neha, 2026-06-11): monthly (12th) — ownership/shareholding via agent.
    - cron: '30 4 12 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sahi-ownership-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Pull listed-SAHI shareholding (muns agent)
        env:
          MUNS_API_TOKEN: ${{ secrets.MUNS_API_TOKEN }}
          MUNS_AGENT_URL: ${{ secrets.MUNS_AGENT_URL }}
        run: npx tsx scripts/ingest/sahi-ownership-agent.ts
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/snapshots/ownership-snapshot.json
          if git diff --staged --quiet; then echo "No change."; exit 0; fi
          git commit -m "ownership: listed-SAHI shareholding via muns agent @ $(date -u +%Y-%m-%dT%H:%MZ)"
          # Push races are routine here; the retry loop this replaces could not
          # survive one - a conflicting rebase left unmerged files and every later
          # attempt died on them. See scripts/ci/push-with-retry.sh.
          bash scripts/ci/push-with-retry.sh
