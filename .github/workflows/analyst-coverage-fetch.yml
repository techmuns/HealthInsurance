name: analyst coverage fetch

# Fills the "Analyst coverage" sheet: for each DATED broker report the
# template names, the muns agent finds the public aggregator page and returns
# target price + price at recommendation (the sanctioned low-confidence
# backup — broker targets have no official feed). The tuple list is read from
# schema-map.json, so template updates change the ask automatically. Then the
# grid is rebuilt, QA-gated and committed.

on:
  workflow_dispatch:
  schedule:
    # Daily — keep pulling the live broker reports with no human step. New
    # targets land as they publish, and because the merge only ever ADDS (never
    # wipes a filled cell), the flaky aggregator's misses get filled in over
    # successive runs.
    - cron: '0 6 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: analyst-coverage-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Pull broker reports - Trendlyne scrape (India IP) + muns agent backup
        env:
          MUNS_API_TOKEN: ${{ secrets.MUNS_API_TOKEN }}
          MUNS_AGENT_URL: ${{ secrets.MUNS_AGENT_URL }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPER_KEY }}
        run: npx tsx scripts/ingest/analyst-coverage-agent.ts

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Project into the workbook grid
        run: |
          pip install openpyxl
          # Standing instruction extended to ROWS (Neha, 2026-08-17): Analyst
          # coverage grows downward, one row per dated broker note. Never fails
          # the build - it verifies itself and declines to write on any doubt,
          # leaving the previous good template in place.
          python3 scripts/excel/extend_analyst_coverage.py || echo "WARNING: analyst-coverage row extension declined to write (see above); continuing with the existing template."
          python3 scripts/excel/build_schema_map.py templates/niva-bupa-portfolio-review.xlsx
          python3 scripts/excel/build_value_store.py
          python3 scripts/excel/fill_template.py
          python3 scripts/excel/build_audit_index.py

      - name: QA gate
        run: python3 scripts/excel/qa_checks.py

      # A hard QA violation must never be silent again: two weeks of red runs
      # went unnoticed because the gate failed quietly before the commit step.
      # On failure, open / refresh one issue naming the exact cells and why.
      - name: Alert on QA-gate failure (open / refresh issue)
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = `${process.env.RUNNER_TEMP}/excel-qa-report.json`;
            if (!fs.existsSync(p)) { core.info('no QA report - the failure is upstream of the gate'); return; }
            const rep = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (rep.passed) return;
            const title = '⛔ Excel QA gate failing: data not committing';
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            const body = [
              `The Excel QA gate found **${rep.hard.length}** hard violation(s) on run [${context.runId}](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}) (workflow: ${context.workflow}, ${rep.generated_at}).`,
              '', 'Until this is fixed, **no data from this workflow reaches the dashboard** - it keeps showing the last committed values.', '',
              '**Violations**', ...rep.hard.map((h) => `- ${h}`), '',
              '**What to do**: the value store already quarantines unsourced / out-of-range values, so a failure here is a structural one (a sheet, formula or partition problem). Fix the cause in scripts/excel and re-run the workflow.',
            ].join('\n');
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `🔄 Still failing on run ${context.runId} (${context.workflow}).` });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

      - name: Close the QA-gate issue once green
        if: success()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⛔ Excel QA gate failing: data not committing';
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const existing = open.find((i) => i.title === title && !i.pull_request);
            if (!existing) return;
            await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `✅ QA gate passing again on run ${context.runId} (${context.workflow}). Auto-closing.` });
            await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });

      - name: Commit refreshed data
        run: |
          git config user.name "insurance-data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          # 1) Commit ONLY the analyst-exclusive source (snapshot + raw pulls). No
          #    other workflow touches these, so this commit always rebases cleanly.
          git add src/data/snapshots/analyst-coverage-snapshot.json data/agent-pulls/analyst-coverage templates/ schema-map.json
          git commit -m "data: analyst coverage snapshot @ $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "no snapshot change"; exit 0; }
          # 2) Drop the working-tree generated files; they are rebuilt after landing.
          git checkout -- . 2>/dev/null || true
          git clean -fd data/processed src/data/snapshots 2>/dev/null || true
          # 3) Land on latest main and REBUILD the derived files there (they are
          #    generated, never merged), then commit + push. Retry on races with
          #    other data workflows (this is what the old git-pull-rebase tripped on).
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main || { git rebase --abort 2>/dev/null || true; sleep 5; continue; }
            python3 scripts/excel/build_value_store.py >/dev/null 2>&1 || true
            python3 scripts/excel/build_audit_index.py >/dev/null 2>&1 || true
            git add data/ src/data/snapshots/ templates/ schema-map.json
            git diff --staged --quiet || git commit -m "data: rebuild audit index @ $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            git log -1 --pretty=%s | grep -q "rebuild audit index" && git reset --hard HEAD~1
            sleep 5
          done
          echo "ERROR: push failed after retries"; exit 1
