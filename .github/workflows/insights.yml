name: insights generate

# Regenerates the Insights tab's ranked feed with the INSIGHT ENGINE — a
# deterministic detector battery that scans the wide market panel (discrete
# quarters, single months, fiscal years, ownership, analyst notes, prices,
# valuation, channel mix) and writes the cards itself. No API key, no manual
# authoring: a fresh filing -> new findings -> new cards, organised by the
# quarter/month where each insight became observable. Two fail-closed gates
# (numeric grounding + arithmetic/direction audit) run before anything is
# written OR committed. The committed JSON auto-deploys via the Pages build.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1' # weekly, Monday 05:00 UTC
  push:
    branches: [main]
    paths:
      - 'src/data/snapshots/**'
      - 'src/data/valuationData.ts'
      - 'src/insights/**'
  # A data workflow's OWN commit (pushed via GITHUB_TOKEN) does NOT fire the push
  # trigger above — GitHub suppresses workflow-triggered-by-workflow pushes. So also
  # run after the data-refresh workflows complete, keeping insights in lock-step with
  # every new month of data instead of waiting for the weekly schedule.
  workflow_run:
    workflows:
      - "gic-segment-monthly"
      - "insurance-data-ingest"
      - "monthly ingestion"
      - "insurer quarterly premium fetch"
      - "industry segment history fetch"
      # Fundamentals / valuation / consensus sources — these feed the solvency,
      # valuation and analyst-consensus signals (e.g. the target-dispersion number).
      # Without them here, a coverage/valuation refresh only reached the feed on the
      # weekly cron, so those numbers could sit stale for up to a week.
      - "analyst coverage fetch"
      - "listed valuation fetch"
      - "valuation fundamentals fetch"
      - "sahi financials fetch"
      - "sahi ppt metrics fetch"
      - "niva fy25 financials fetch"
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: insights-generate
  cancel-in-progress: false

jobs:
  generate:
    # Run on a chained data workflow only when it SUCCEEDED; manual / scheduled / push
    # runs always proceed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Regenerate FIRST, then validate the fresh output. The engine is fail-closed
      # (it writes nothing unless every number is grounded in the live signals and
      # the arithmetic/direction gate passes), so the firewall is fully preserved.
      # Running the check before regeneration used to deadlock: when the live data
      # drifted, the committed cards went stale, the check failed on those stale
      # numbers, and the job aborted *before* the regeneration step that would have
      # fixed them — so the feed could never self-heal. Generate-then-validate
      # removes that deadlock.
      #
      # The engine is deterministic and keyless by design — same data, same cards,
      # no secret to rotate, nothing to babysit. (The optional AI writer,
      # scripts/generate-insights.ts, remains available for manual experiments but
      # is no longer part of the automated path.)
      - name: Generate insights (deterministic engine)
        # A transient failure is not fatal: the last insights stay shown
        # (the grounding check below still guards honesty). Never red the run over it.
        continue-on-error: true
        run: npm run insights:generate:engine

      # Belt-and-suspenders: validate whatever is now on disk (the freshly generated
      # feed, or the committed one if regeneration was skipped). Fail-closed.
      - name: Signal + grounding checks
        run: npm run insights:check

      - name: Commit refreshed insights
        run: |
          git config user.name "insights-bot"
          git config user.email "insights-bot@users.noreply.github.com"
          git add src/data/insights.generated.json
          git diff --staged --quiet && { echo "no change this run"; exit 0; }
          git commit -m "data: regenerate insights @ $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase origin/main || { git rebase --abort 2>/dev/null || true; sleep 5; continue; }
            if git push origin HEAD:main; then echo "pushed on attempt $i"; exit 0; fi
            sleep 5
          done
          echo "ERROR: push failed after retries"; exit 1
