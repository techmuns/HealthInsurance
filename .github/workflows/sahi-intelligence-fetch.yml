name: sahi intelligence fetch

# Generates the AI Market Intelligence feed (upcoming investor meets, earnings /
# board dates, sector & regulatory news, share catalysts) for Niva Bupa + the
# SAHI sector via the muns chat agent, and writes
# src/data/snapshots/market-intelligence-snapshot.json. AI-generated, source-
# linked; clearly labelled in the UI. Can be scheduled to refresh periodically.
#
# Secrets used:
#   MUNS_API_TOKEN  (required) bearer token for the chat agent.

on:
  schedule:
    # Curated Market Intelligence feed — the daily-moving layer in the Insights
    # tab (analyst actions, regulatory & sector news, catalysts). The Pulse page
    # stamps this job's last-run time, so more runs through the day = a fresher
    # "today" brief. Was weekly (Wed) → daily (2026-06-29) → every 4 hours across
    # the working day (Neha, 2026-07-03), 07:30–19:30 IST:
    #   02:00 UTC = 07:30 IST   (first run of the day)
    #   06:00 UTC = 11:30 IST
    #   10:00 UTC = 15:30 IST
    #   14:00 UTC = 19:30 IST   (last run — nothing after 22:00 IST)
    # then the cycle restarts at 07:30 IST next morning.
    - cron: '0 2,6,10,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sahi-intelligence-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Generate AI market intelligence (muns agent)
        env:
          MUNS_API_TOKEN: ${{ secrets.MUNS_API_TOKEN }}
          MUNS_AGENT_URL: ${{ secrets.MUNS_AGENT_URL }}
        run: npx tsx scripts/ingest/sahi-intelligence-agent.ts
      - name: Freeze the daily Pulse brief archive
        # Upserts today's (IST) immutable per-company brief record from the just-
        # refreshed snapshot, so past days stay frozen on the Pulse timeline.
        # Non-fatal: a hiccup here must never drop the fresh snapshot's commit below.
        continue-on-error: true
        run: npx tsx --tsconfig tsconfig.app.json scripts/ingest/build-pulse-archive.ts
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/snapshots/market-intelligence-snapshot.json src/data/snapshots/pulse-brief-archive.json
          if git diff --staged --quiet; then echo "No change."; exit 0; fi
          git commit -m "intelligence: AI market-intelligence feed + Pulse brief archive @ $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then echo "pushed $i"; exit 0; fi
            echo "retry $i"; sleep 3
          done
          echo "ERROR: push failed"; exit 1
